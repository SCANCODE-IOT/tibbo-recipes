<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>4-20 мА · Tibbo</title>
<style>
body{font-family:system-ui,Segoe UI,Roboto,sans-serif;margin:0;background:#FBF8F5;color:#2C2B28}
header{background:#2C2B28;color:#fff;padding:14px 16px}header b{color:#EC6C2E}
main{max-width:900px;margin:0 auto;padding:12px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card{background:#fff;border:1px solid #EBE4DB;border-radius:10px;padding:14px;margin:12px 0}
.big{font-size:30px;font-weight:700}.err{color:#C0392B}small{color:#6F6C66}
svg{width:100%;height:220px;display:block}button{padding:5px 10px;border:1px solid #DDD4C8;background:#fff;border-radius:8px;margin:0 4px 6px 0}button.on{background:#EC6C2E;color:#fff;border-color:#EC6C2E}
</style></head><body>
<header><b>Tibbo</b> · Сбор данных 4-20 мА</header>
<main>
<div class=grid>
<?
include "global.tbh"
dim s as string
dim i as byte
for i = 0 to CH_COUNT - 1
	s = "<div class=card><small>" + daq_name(i) + ", " + daq_unit(i) + "</small><div class=big>"
	if daq_fault(i) = YES then
		s = s + "<span class=err>обрыв</span>"
	else
		s = s + daq_now(i)
	end if
	s = s + "</div><small>" + daq_ma(i) + " мА</small></div>"
	web_send(s)
next i
?>
</div>
<div class=card><div id=btns></div><svg id=g viewBox="0 0 900 220" preserveAspectRatio="none"></svg>
<small>Средние за минуту, последние сутки. <a id=csv href="data.csv?c=0">Скачать CSV</a> · данные хранятся до перезагрузки</small></div>
</main>
<script>
var names=[<?
for i = 0 to CH_COUNT - 1
	s = "'" + daq_name(i) + "',"
	web_send(s)
next i
?>],cur=0;
function draw(){fetch('data.csv?c='+cur+'&'+Date.now()).then(r=>r.text()).then(t=>{
var v=t.trim().split('\n').slice(1).map(l=>parseFloat(l.split(';')[1]));var g=document.getElementById('g');
var f=v.filter(x=>!isNaN(x));if(!f.length){g.innerHTML='<text x=20 y=110 fill=#6F6C66>Нет данных: первая точка появится через минуту</text>';return}
var mn=Math.min(...f),mx=Math.max(...f);if(mx==mn){mx+=1;mn-=1}var W=900,H=220,p='';
v.forEach((y,i)=>{if(isNaN(y))return;var X=i*W/Math.max(v.length-1,1),Y=H-10-(y-mn)*(H-20)/(mx-mn);p+=(p?'L':'M')+X.toFixed(1)+' '+Y.toFixed(1)});
g.innerHTML='<path d="'+p+'" fill=none stroke=#EC6C2E stroke-width=2 vector-effect=non-scaling-stroke></path><text x=4 y=14 font-size=12 fill=#6F6C66>'+mx.toFixed(2)+'</text><text x=4 y=214 font-size=12 fill=#6F6C66>'+mn.toFixed(2)+'</text>';
document.getElementById('csv').href='data.csv?c='+cur})}
function btns(){document.getElementById('btns').innerHTML=names.map((n,i)=>'<button class="'+(i==cur?'on':'')+'" onclick="cur='+i+';btns();draw()">'+n+'</button>').join('')}
btns();draw();setInterval(draw,60000);
</script>
</body></html>
