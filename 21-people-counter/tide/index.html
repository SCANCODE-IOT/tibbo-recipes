<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Счётчик посетителей · Tibbo</title>
<style>
body{font-family:system-ui,Segoe UI,Roboto,sans-serif;margin:0;background:#FBF8F5;color:#2C2B28}
header{background:#2C2B28;color:#fff;padding:14px 16px}header b{color:#EC6C2E}
main{max-width:720px;margin:0 auto;padding:12px 16px}
.card{background:#fff;border:1px solid #EBE4DB;border-radius:10px;padding:16px 18px;margin:12px 0}
.row{display:flex;gap:12px}.row .card{flex:1;margin:0}.big{font-size:48px;font-weight:700}.lbl{color:#6F6C66;font-size:14px}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:10px}.bars div{flex:1;background:#EC6C2E;border-radius:3px 3px 0 0;min-height:1px}
.ax{display:flex;justify-content:space-between;font-size:12px;color:#6F6C66}small{color:#6F6C66}
</style></head><body>
<header><b>Tibbo</b> · Счётчик посетителей, <? include "global.tbh"
web_send(CFG_NAME) ?></header>
<main>
<div class=row><div class=card><div class=lbl>Вошли сегодня</div><div class=big id=it>-</div></div><div class=card><div class=lbl>Вышли сегодня</div><div class=big id=ot>-</div></div></div>
<div class=card><div class=lbl>Входы по часам за последние сутки</div><div class=bars id=bars></div><div class=ax><span>-24 ч</span><span>сейчас</span></div></div>
<div class=card><small id=st></small><br><small>Данные: <code>counts.csv</code> (по часам за неделю), <code>state.txt</code> (сейчас).</small></div>
</main>
<script>
function st(){fetch('state.txt?'+Date.now()).then(r=>r.text()).then(t=>{var v={};t.split('\n').forEach(l=>{var i=l.indexOf('=');if(i>0)v[l.slice(0,i)]=l.slice(i+1)});
it.textContent=v.in_today;ot.textContent=v.out_today;document.getElementById('st').textContent=(v.time_ok==='1'?'Время: '+v.date+', '+v.hour+' ч. ':'Время не установлено. ')+'Журнал: '+v.log_hours+' ч из '+v.log_capacity+'.'}).catch(()=>{})}
function ch(){fetch('counts.csv?'+Date.now()).then(r=>r.text()).then(t=>{var r=t.trim().split('\n').slice(1,25).map(l=>+l.split(';')[3]||0).reverse(),m=Math.max(1,...r);
bars.innerHTML=r.map(x=>'<div style="height:'+Math.round(100*x/m)+'%" title="'+x+'"></div>').join('')}).catch(()=>{})}
st();ch();setInterval(st,3000);setInterval(ch,60000);
</script>
</body></html>
