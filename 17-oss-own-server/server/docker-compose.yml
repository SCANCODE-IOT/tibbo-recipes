# Рецепт 17 «OSS со своим сервером» - сервер для данных OSS.
# Mosquitto (приём от OSS по TLS) -> Node-RED (разбор, время, оповещения) -> InfluxDB -> Grafana.
# Запуск: cp .env.example .env, поправить .env, ./scripts/make-certs.sh <адрес сервера>, docker compose up -d
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    restart: unless-stopped
    ports:
      - "8883:8883"                      # только TLS-порт для OSS; 1883 остаётся внутри сети docker
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUX_RETENTION}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influx-data:/var/lib/influxdb2

  nodered:
    image: nodered/node-red:4.0.9
    restart: unless-stopped
    depends_on: [mosquitto, influxdb]
    ports:
      - "127.0.0.1:1880:1880"            # редактор Node-RED - только с самого сервера или через SSH-туннель
    environment:
      TZ: ${TZ}
      MQTT_HOST: mosquitto
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      TELEGRAM_CHAT: ${TELEGRAM_CHAT}
      THRESHOLDS: ${THRESHOLDS}
      NODATA_MIN: ${NODATA_MIN}
    volumes:
      - ./nodered:/data

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    depends_on: [influxdb]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  mosquitto-data:
  influx-data:
  grafana-data:
