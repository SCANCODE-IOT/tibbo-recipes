# Рецепт 17 · брокер MQTT для OSS
per_listener_settings true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# внутренний порт: только для Node-RED внутри сети docker, наружу не открыт
listener 1883
allow_anonymous true

# порт для устройств OSS: TLS 1.2, логин и пароль, у каждого устройства только свои топики
listener 8883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
